intro:
  - >-
    Here's the thing. I got SO bored of being a consumer of AI goods. Everybody
    else gets to build the shiny stuff, and I just get to click on it? Yeah,
    no. I want in.
  - >-
    So I'm switching teams, from consumer to contributor. Watch out for
    research work and findings landing on this very page.
  - >-
    Let's hope I make a good research scientist. (If this page stays empty for
    a while, mind your business... science takes time.)
