intro:
  - I think I have some thoughts worth sharing...
  - >-
    So whenever the itch to write shows up, I dump it here: a glimpse of
    whatever's firing through the hidden layers of this brain. Raw activations,
    zero fine-tuning.
  - >-
    Lately a lot of it is research. I got SO bored of being a consumer of AI
    goods, so I switched teams, from consumer to contributor. Findings,
    half-baked theories and lab notes land on this page too.
  - >-
    (No promises the output layer always makes sense. A few of these opinions
    are still backpropagating, and if the research entries look scanty for a
    while, mind your business... science takes time.)
