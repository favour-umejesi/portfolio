intro:
  - >-
    I have SO many thoughts worth sharing. Too many, honestly. My brain does not
    come with an off switch.
  - >-
    So whenever the itch to write shows up, I dump it here: a glimpse of
    whatever's firing through the hidden layers of this brain. Raw activations,
    zero fine-tuning.
  - >-
    (No promises the output layer always makes sense. A few of these opinions
    are still backpropagating.)
