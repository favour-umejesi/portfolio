bio:
  - >-
    Hello! I'm Favour Umejesi, a third-year ==Computer Science== student at
    ==Grambling State University==, minoring in ==Mathematics==.
  - >-
    I'm curious about how intelligent systems work, why they behave the way they
    do, and what it takes to make them ==more reliable for the people who use
    them==. I enjoy both understanding the science behind these systems and
    building software that solves real problems.
  - >-
    Currently, under the guidance of ==Dr. Vivya Kalidindi==, I'm exploring
    ==mechanistic interpretability== in large language models. My work began
    with investigating the effects of layer ablation on GPT-2 and has since led
    me to broader questions about factual recall, hallucinations, and how
    knowledge is represented within neural networks. I'm particularly interested
    in ==AI safety== and ==human-AI collaboration==, though I'm still
    discovering the questions I want to pursue.
  - >-
    The more I learn, the more I realize how much there is to understand. I've
    come to appreciate research not just for the answers it might provide, but
    for ==the questions it teaches me to ask==. I'm learning, building, and
    figuring things out along the way.
  - >-
    Outside of computer science, you'll probably find me reading classic
    literature, watching a Studio Ghibli film (my favorites are *Whisper of the
    Heart* and *From Up on Poppy Hill* ♡), or attempting to teach myself to play
    the guitar :guitar:. The guitar is very much a work in progress! :)
interests:
