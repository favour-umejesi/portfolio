summary: >-
  Built an LLM-powered email editing and evaluation application during the
  ServiceNow AI Accelerate Bootcamp. Developed datasets of email examples and
  experimented with system prompts and prompt design to guide controlled
  transformations, including shortening or expanding content, adjusting tone,
  and selectively rewriting portions of a message while preserving the original
  intent. Built an LLM-as-a-judge evaluation pipeline that assesses generated
  responses across six criteria: faithfulness, completeness, conciseness,
  grammar and clarity, tone consistency, and URL preservation. The application
  supports multiple LLMs for both generation and evaluation, enabling comparison
  of model behavior and output quality across different editing tasks.
