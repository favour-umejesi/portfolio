summary: >-
  Collaborated with a team to develop a data-driven MVP for Rescuing Leftover
  Cuisine, a nonprofit that redirects excess food to communities in need. We
  designed an intelligent matching system combining NLP-based food
  categorization with geospatial analysis and proximity-based routing to better
  connect surplus-food donors with nearby recipient organizations and reduce
  inefficient cross-ZIP travel. Built with Next.js, PostgreSQL, and Google Maps,
  the broader solution incorporated simplified donor onboarding, automated food
  matching, and proximity-aware distribution. Our improvements received special
  recognition from Rescuing Leftover Cuisine’s CEO for their potential to
  improve food-rescue operations and reduce waste.
