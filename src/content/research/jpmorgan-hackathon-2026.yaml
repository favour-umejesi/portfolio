summary: >-
  Collaborated with a team to develop a data-driven MVP for Rescuing Leftover
  Cuisine, addressing inefficiencies in matching surplus food donations with
  recipient organizations. We designed an intelligent matching system that
  applied natural language processing to food descriptions to categorize
  donations and improve donor-recipient matching, alongside geospatial routing
  to identify nearby recipients and reduce inefficient cross-ZIP travel. The
  broader solution incorporated simplified donor onboarding and verification,
  automated food matching, and proximity-based routing to help increase food
  rescue opportunities while reducing transportation inefficiencies and food
  waste.
