summary: >-
  EcoTrack is an open-source climate platform that helps users calculate and
  visualize their carbon footprint, track progress over time, and share
  sustainable actions through a community feed. Beyond the application, EcoTrack
  serves as a research testbed for exploring retrieval-augmented generation
  (RAG), alternative retrieval approaches, and methods for improving semantic
  search and information retrieval. Its Climate AI Assistant applies these
  techniques to answer climate questions from authoritative research with
  grounded, source-cited responses.
