summary: >-
  As part of a five-person team, developed an end-to-end Named Entity
  Recognition (NER) pipeline for extracting structured attributes such as make,
  model, year, and part type from 2M+ unstructured German automotive listings.
  Our solution combined XLM-RoBERTa and GELECTRA in a transformer ensemble,
  using weighted cross-entropy to address class imbalance and temperature
  scaling to calibrate model confidence. We optimized the pipeline for batched,
  large-scale inference, achieving a 0.933 F1 score and 0.955 accuracy and
  placing in the Top 10% of the eBay 2025 University Machine Learning Challenge.
