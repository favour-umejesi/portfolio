summary: >-
  Collaborated with a team to analyze community data for The Concilio, a Dallas
  nonprofit supporting Latino and other diverse families. We developed an
  unsupervised K-Means clustering model to identify geographic areas with high
  community needs and segment households within each ZIP code into three levels
  of need based on demographic and socioeconomic factors such as age, household
  size, income, insurance status, and benefits. We integrated the model into an
  interactive web application for classifying new household data, helping The
  Concilio visualize community needs and make more informed decisions about
  resource allocation.
