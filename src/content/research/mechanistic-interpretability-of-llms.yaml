summary: >-
  Conducting ongoing undergraduate research under the guidance of Dr. Vivya
  Kalidindi at Grambling State University, investigating how information is
  represented and processed across layers of transformer-based language models.
  Using GPT-2, I conduct layer-wise zero-ablation experiments on feed-forward
  network (FFN) components to measure how individual layers affect model
  predictions and help localize factual knowledge. I also use TransformerLens
  and PyTorch to analyze logit attribution across the residual stream,
  identifying potential “source” and “inhibitor” layers associated with model
  predictions and latent hallucinations. This work explores how understanding
  layer-level behavior can provide greater insight into the internal mechanisms
  behind factual recall, hallucinations, and model confidence.
excerpt: >-
  Ongoing work with Dr. Vivya Kalidindi on how GPT-2 represents and processes
  information across its layers, using layer-wise ablation and logit attribution
  to trace factual recall, hallucinations, and model confidence.
question: >-
  Which layers of a transformer carry a fact to the output, and which ones
  suppress it, when a model recalls, hallucinates, or hedges?
contribution: >-
  Layer-wise zero-ablation of GPT-2's feed-forward layers to measure each
  layer's effect on predictions, and logit attribution across the residual
  stream with TransformerLens and PyTorch.
findings: >-
  Preliminary: a small set of candidate "source" layers that raise the right
  answer and "inhibitor" layers that hold it back, which together may help
  localize factual knowledge and latent hallucinations.
status: Ongoing
